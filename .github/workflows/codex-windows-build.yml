name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [codex-merge, codex-language-build]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $props = Get-Content Directory.Build.props -Raw
          $version = [regex]::Match($props, '<VersionBase>(.*?)</VersionBase>').Groups[1].Value
          $name = "OpenTabletDriver-$version-win-x64"
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name=$name"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Standard layout: separate daemon and GUI executables with their assemblies
      # laid out beside them, matching the upstream portable build.
      - name: Publish folder build
        shell: pwsh
        run: |
          $dest = "out/${{ steps.version.outputs.name }}"
          $common = @(
            "-c", "Release", "-r", "win-x64", "--self-contained", "true",
            "-p:PublishSingleFile=false", "-p:PublishTrimmed=false",
            "-p:DebugType=embedded", "-p:SuppressNETCoreSdkPreviewMessage=true"
          )
          dotnet publish OpenTabletDriver.Daemon/OpenTabletDriver.Daemon.csproj -f net10.0 @common -o $dest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish OpenTabletDriver.UX.Wpf/OpenTabletDriver.UX.Wpf.csproj -f net10.0-windows @common -o $dest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Add portable marker and readme
        shell: pwsh
        run: |
          $dest = "out/${{ steps.version.outputs.name }}"
          New-Item -ItemType Directory -Force -Path "$dest/userdata" | Out-Null
          Copy-Item "eng/windows/README-zh-CN.txt" "$dest/" -ErrorAction SilentlyContinue

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.name }}
          path: out/${{ steps.version.outputs.name }}
          if-no-files-found: error
          compression-level: 0

      # GitHub release assets must be files, so the release gets a single zip whose only
      # top-level entry is the folder. Nothing else is nested inside it.
      - name: Archive release asset
        shell: pwsh
        run: |
          Compress-Archive -Path "out/${{ steps.version.outputs.name }}" `
            -DestinationPath "${{ steps.version.outputs.name }}.zip" -Force

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          name: OpenTabletDriver ${{ steps.version.outputs.value }} (codex)
          prerelease: true
          files: ${{ steps.version.outputs.name }}.zip
          fail_on_unmatched_files: true
