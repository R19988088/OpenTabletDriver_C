name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [codex-merge, codex-language-build]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $props = Get-Content Directory.Build.props -Raw
          $version = [regex]::Match($props, '<VersionBase>(.*?)</VersionBase>').Groups[1].Value
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish single-file executable
        shell: pwsh
        run: |
          dotnet publish OpenTabletDriver.UX.Wpf/OpenTabletDriver.UX.Wpf.csproj `
            -c Release -f net10.0-windows -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:PublishTrimmed=false `
            -p:DebugType=embedded `
            -p:SuppressNETCoreSdkPreviewMessage=true `
            -o dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble portable package
        id: package
        shell: pwsh
        run: |
          $name = "OpenTabletDriver-${{ steps.version.outputs.value }}-win-x64"
          New-Item -ItemType Directory -Force -Path "pkg/$name" | Out-Null
          Copy-Item "dist/OpenTabletDriver.UX.Wpf.exe" "pkg/$name/OpenTabletDriver.exe"
          Copy-Item "eng/windows/README-zh-CN.txt" "pkg/$name/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "pkg/$name" -DestinationPath "$name.zip" -Force
          "zip=$name.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenTabletDriver-win-x64
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          name: OpenTabletDriver ${{ steps.version.outputs.value }} (codex)
          prerelease: true
          files: ${{ steps.package.outputs.zip }}
