name: Codex macOS Build

on:
  workflow_dispatch:
  push:
    branches: [codex-language-build]

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Bash 5
        run: brew install bash
      - name: Build macOS arm64 app
        run: |
          set +e
          VERSION_SUFFIX=-ci /opt/homebrew/bin/bash ./build.sh --runtime osx-arm64 --signed true --output dist
          status=$?
          set -e
          test -d dist/OpenTabletDriver.app
          codesign --verify --deep --strict dist/OpenTabletDriver.app
          tar -czf dist/OpenTabletDriver-macos-arm64.tar.gz -C dist OpenTabletDriver.app
          test "$status" -eq 0 || echo "Package helper returned $status; app bundle was packaged directly."
      - name: Upload app package
        uses: actions/upload-artifact@v4
        with:
          name: OpenTabletDriver-macos-arm64
          path: dist/*.tar.gz
          if-no-files-found: error
