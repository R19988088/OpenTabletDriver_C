name: Codex macOS Build

on:
  workflow_dispatch:
  push:
    branches: [codex-language-build]

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build macOS arm64 app
        run: ./build.sh --runtime osx-arm64 --signed true --output dist
      - name: Upload app package
        uses: actions/upload-artifact@v4
        with:
          name: OpenTabletDriver-macos-arm64
          path: dist/*.tar.gz
          if-no-files-found: error
