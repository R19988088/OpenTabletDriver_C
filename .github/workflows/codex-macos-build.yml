name: Codex macOS Build

on:
  workflow_dispatch:
  push:
    branches: [codex-language-build]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    env:
      SIGNING_IDENTITY: "Apple Development: yingqiong guo (3P2AN38HT7)"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Bash 5
        run: brew install bash
      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/macos-signing.p12"
          keychain_path="$RUNNER_TEMP/codex-signing.keychain-db"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$certificate_path"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | grep -F "$SIGNING_IDENTITY"
      - name: Build macOS arm64 app
        run: |
          set +e
          VERSION_SUFFIX=-ci /opt/homebrew/bin/bash ./build.sh --configuration Release --runtime osx-arm64 --signed false --output dist
          status=$?
          set -e
          test -d dist/OpenTabletDriver.app
          codesign --deep --force --sign "$SIGNING_IDENTITY" dist/OpenTabletDriver.app
          codesign --verify --deep --strict dist/OpenTabletDriver.app
          codesign -dv --verbose=4 dist/OpenTabletDriver.app
          find . -type d \( -name bin -o -name obj \) -prune -exec rm -rf {} +
          rm -rf "$HOME/.nuget/packages"
          sudo rm -rf "$HOME/Library/Caches"/*
          hdiutil create -ov -format UDZO \
            -srcfolder dist/OpenTabletDriver.app \
            dist/OpenTabletDriver-macos-arm64.dmg
          test "$status" -eq 0 || echo "Package helper returned $status after creating the app bundle."
      - name: Remove signing certificate
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/codex-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/macos-signing.p12"
      - name: Publish DMG
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.01
          name: OpenTabletDriver macOS ARM64
          prerelease: true
          files: dist/*.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenTabletDriver-macos-arm64
          path: dist/OpenTabletDriver-macos-arm64.dmg
          if-no-files-found: error
